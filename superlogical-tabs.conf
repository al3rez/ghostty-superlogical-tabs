# Standalone top tab strip without a separate GTK titlebar.
window-decoration = client
gtk-titlebar = false
gtk-titlebar-style = native
gtk-tabs-location = top
gtk-wide-tabs = false
gtk-toolbar-style = flat
window-show-tab-bar = always

# Match the tab-strip chrome to the terminal colors.
window-theme = ghostty

# Relative paths resolve from this configuration file.
gtk-custom-css = tabs.css
